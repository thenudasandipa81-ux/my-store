<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">My Online Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase Realtime Database Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary-color: #4f46e5; --bg-color: #f9fafb; }
        body { background-color: var(--bg-color); }
        .bg-primary { background-color: var(--primary-color) !important; }
        .text-primary { color: var(--primary-color) !important; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 id="brand-name" class="text-2xl font-bold text-primary cursor-pointer" onclick="filterCategory('All')">
                Store Name
            </h1>
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative p-2 text-gray-700 hover:text-indigo-600 transition">
                    <i class="fa-solid fa-cart-shopping text-2xl"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Search & Filter -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="flex space-x-2 overflow-x-auto pb-2 w-full md:w-auto" id="category-filters"></div>
            <div class="relative w-full md:w-64">
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Search products..." class="w-full pl-10 pr-4 py-2 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
            </div>
        </div>

        <!-- Products -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-6 mt-12 text-center text-sm">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <p>&copy; <span id="footer-year"></span> <span id="footer-brand">Store Name</span>. All rights reserved.</p>
            <button onclick="openAdminAuth()" class="text-gray-400 hover:text-white transition text-sm flex items-center gap-1 font-bold bg-gray-700 px-3 py-1.5 rounded-lg">
                <i class="fa-solid fa-lock"></i> Admin Portal
            </button>
        </div>
    </footer>

    <!-- CART DRAWER -->
    <div id="cart-drawer" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
        <div class="fixed right-0 top-0 h-full w-full max-w-md bg-white shadow-xl flex flex-col justify-between">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">Your Shopping Cart</h3>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-700 text-xl">&times;</button>
            </div>
            <div id="cart-items" class="p-4 flex-grow overflow-y-auto space-y-4"></div>
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between font-bold text-lg text-gray-800 mb-4">
                    <span>Total:</span>
                    <span id="cart-total">Rs. 0</span>
                </div>
                <button onclick="openCheckoutModal()" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- CHECKOUT MODAL (No Slip) -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 relative shadow-2xl">
            <button onclick="closeCheckoutModal()" class="absolute right-4 top-4 text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Complete Your Order</h3>

            <form id="checkout-form" onsubmit="handlePlaceOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name *</label>
                    <input type="text" id="cust_name" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone / WhatsApp *</label>
                    <input type="text" id="cust_phone" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Delivery Address *</label>
                    <input type="text" id="cust_address" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-green-700 transition flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-2xl"></i> Place Order via WhatsApp
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADMIN LOGIN MODAL -->
    <div id="admin-auth-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl relative">
            <button onclick="closeAdminAuth()" class="absolute right-4 top-4 text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">Admin Portal</h3>
            <p class="text-xs text-gray-500 mb-4">Enter Password (Default: admin123)</p>
            <input type="password" id="admin-pass-input" placeholder="Password" class="w-full border rounded-lg p-2.5 text-center mb-4 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="verifyAdminPassword()" class="w-full bg-primary text-white py-2.5 rounded-lg font-semibold hover:opacity-90 transition">Login</button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-dashboard-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-5xl w-full max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="bg-gray-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-sliders"></i> Store Admin Panel</h3>
                <button onclick="closeAdminDashboard()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>

            <div class="flex border-b bg-gray-100 overflow-x-auto">
                <button onclick="switchAdminTab('orders')" id="tab-btn-orders" class="px-6 py-3 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 bg-white whitespace-nowrap">Live Orders (Real-Time) 🔥</button>
                <button onclick="switchAdminTab('products')" id="tab-btn-products" class="px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-gray-600 hover:text-indigo-600 whitespace-nowrap">Manage Products</button>
                <button onclick="switchAdminTab('settings')" id="tab-btn-settings" class="px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-gray-600 hover:text-indigo-600 whitespace-nowrap">Settings</button>
            </div>

            <div class="p-6 overflow-y-auto flex-grow">
                <!-- ORDERS TAB -->
                <div id="tab-orders" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-gray-800 text-base">Real-Time Customer Orders</h4>
                        <button onclick="clearAllOrders()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded font-bold hover:bg-red-200">Clear All Orders</button>
                    </div>
                    <div id="admin-orders-list" class="space-y-4"></div>
                </div>

                <!-- PRODUCTS TAB -->
                <div id="tab-products" class="hidden space-y-6">
                    <div class="bg-gray-50 p-4 border rounded-xl space-y-4">
                        <h4 class="font-bold text-gray-800 text-base">Add New Product</h4>
                        <form id="add-product-form" onsubmit="handleAddProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-semibold text-gray-600">Product Title *</label><input type="text" id="prod-title" required class="w-full border rounded p-2 text-sm"></div>
                            <div><label class="block text-xs font-semibold text-gray-600">Price (Rs.) *</label><input type="number" id="prod-price" required class="w-full border rounded p-2 text-sm"></div>
                            <div><label class="block text-xs font-semibold text-gray-600">Category *</label><input type="text" id="prod-category" required class="w-full border rounded p-2 text-sm"></div>
                            <div><label class="block text-xs font-semibold text-gray-600">Image URL *</label><input type="text" id="prod-image" required class="w-full border rounded p-2 text-sm"></div>
                            <div class="md:col-span-2"><label class="block text-xs font-semibold text-gray-600">Description</label><textarea id="prod-desc" rows="2" class="w-full border rounded p-2 text-sm"></textarea></div>
                            <div class="md:col-span-2"><button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg font-semibold text-sm">Add Product</button></div>
                        </form>
                    </div>

                    <div>
                        <h4 class="font-bold text-gray-800 mb-3">Existing Products</h4>
                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse border border-gray-200 text-left text-sm">
                                <thead class="bg-gray-100 text-gray-700">
                                    <tr><th class="p-2 border">Image</th><th class="p-2 border">Title</th><th class="p-2 border">Price</th><th class="p-2 border">Category</th><th class="p-2 border">Action</th></tr>
                                </thead>
                                <tbody id="admin-products-table"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- SETTINGS TAB -->
                <div id="tab-settings" class="hidden space-y-4 max-w-xl">
                    <form id="store-settings-form" onsubmit="handleSaveSettings(event)" class="space-y-4">
                        <div><label class="block text-xs font-semibold text-gray-600">Store Name</label><input type="text" id="set-store-name" required class="w-full border rounded p-2 text-sm"></div>
                        <div><label class="block text-xs font-semibold text-gray-600">WhatsApp Number (e.g. 947XXXXXXXX)</label><input type="text" id="set-whatsapp" required class="w-full border rounded p-2 text-sm"></div>
                        <div><label class="block text-xs font-semibold text-gray-600">Admin Password</label><input type="password" id="set-admin-pass" class="w-full border rounded p-2 text-sm"></div>
                        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold text-sm">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Free Firebase Cloud Instance for Realtime Syncing
        const firebaseConfig = {
            databaseURL: "https://online-store-slip-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const DEFAULT_PRODUCTS = [
            { id: 1, title: "Classic Shirt", price: 2500, category: "Clothing", image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&q=80", description: "Premium cotton shirt." }
        ];

        const DEFAULT_SETTINGS = {
            storeName: "My Online Store",
            whatsapp: "94770000000",
            adminPassword: "admin123"
        };

        let products = JSON.parse(localStorage.getItem('products')) || DEFAULT_PRODUCTS;
        let settings = JSON.parse(localStorage.getItem('store_settings')) || DEFAULT_SETTINGS;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let liveOrders = [];
        let selectedCategory = 'All';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('footer-year').innerText = new Date().getFullYear();
            applySettings();
            renderProducts();
            renderCart();
            listenToLiveOrders(); // Auto-fetches orders from Cloud in Realtime
        });

        function applySettings() {
            document.getElementById('brand-name').innerText = settings.storeName;
            document.getElementById('footer-brand').innerText = settings.storeName;
        }

        // REAL-TIME LISTENER: Runs automatically when a phone submits an order
        function listenToLiveOrders() {
            db.ref('orders').on('value', (snapshot) => {
                const data = snapshot.val();
                liveOrders = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        liveOrders.unshift({ id: key, ...data[key] });
                    });
                }
                renderAdminOrders();
            });
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            const filtered = products.filter(p => selectedCategory === 'All' || p.category.toLowerCase() === selectedCategory.toLowerCase());

            filtered.forEach(prod => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="h-56 overflow-hidden bg-gray-100 relative">
                            <img src="${prod.image}" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur px-2.5 py-1 rounded-full text-xs font-semibold text-gray-700">${prod.category}</span>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-gray-800 text-lg mb-1">${prod.title}</h3>
                            <p class="text-xs text-gray-500 mb-3">${prod.description || ''}</p>
                            <div class="text-primary font-extrabold text-xl">Rs. ${prod.price.toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="addToCart(${prod.id})" class="w-full bg-primary text-white py-2.5 rounded-xl font-semibold text-sm hover:opacity-90 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
            renderCategoryButtons();
        }

        function renderCategoryButtons() {
            const container = document.getElementById('category-filters');
            const categories = ['All', ...new Set(products.map(p => p.category))];
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition ${selectedCategory === cat ? 'bg-primary text-white' : 'bg-gray-200 text-gray-700'}">${cat}</button>
            `).join('');
        }

        function filterCategory(cat) { selectedCategory = cat; renderProducts(); }

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('#product-grid > div').forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = title.includes(query) ? 'flex' : 'none';
            });
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) existing.qty += 1; else cart.push({ ...prod, qty: 1 });
            saveCart(); renderCart(); toggleCart(true);
        }

        function updateCartQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            saveCart(); renderCart();
        }

        function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); }

        function renderCart() {
            const container = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-total').innerText = `Rs. ${totalPrice.toLocaleString()}`;

            if (cart.length === 0) return container.innerHTML = `<p class="text-center text-gray-400 py-12">Your cart is empty.</p>`;

            container.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between border-b pb-3">
                    <div class="flex items-center space-x-3">
                        <img src="${item.image}" class="w-12 h-12 rounded object-cover">
                        <div>
                            <h4 class="font-bold text-gray-800 text-sm">${item.title}</h4>
                            <p class="text-xs text-primary font-semibold">Rs. ${item.price.toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="updateCartQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded font-bold">-</button>
                        <span class="text-sm font-bold">${item.qty}</span>
                        <button onclick="updateCartQty(${item.id}, 1)" class="w-6 h-6 bg-gray-200 rounded font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart(forceOpen = false) {
            const drawer = document.getElementById('cart-drawer');
            if (forceOpen) drawer.classList.remove('hidden'); else drawer.classList.toggle('hidden');
        }

        function openCheckoutModal() {
            if (cart.length === 0) return alert('Cart is empty!');
            toggleCart(false);
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }

        // ORDER SUBMISSION TO REALTIME CLOUD
        async function handlePlaceOrder(e) {
            e.preventDefault();
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const orderData = {
                date: new Date().toLocaleString(),
                name: document.getElementById('cust_name').value,
                phone: document.getElementById('cust_phone').value,
                address: document.getElementById('cust_address').value,
                items: cart,
                total: totalPrice
            };

            // Pushes Order to Cloud Database Instantly
            await db.ref('orders').push(orderData);

            // Open WhatsApp
            let message = `🛒 *NEW ORDER - ${settings.storeName}*\n\n`;
            message += `*Customer:* ${orderData.name}\n`;
            message += `*Phone:* ${orderData.phone}\n`;
            message += `*Address:* ${orderData.address}\n\n`;
            message += `*Items Ordered:*\n`;
            cart.forEach((i, idx) => {
                message += `${idx + 1}. ${i.title} (x${i.qty}) - Rs. ${(i.price * i.qty).toLocaleString()}\n`;
            });
            message += `\n💰 *Total Amount: Rs. ${totalPrice.toLocaleString()}*`;

            let cleanPhone = settings.whatsapp.replace(/[^0-9]/g, '');
            const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;

            cart = [];
            saveCart();
            renderCart();
            closeCheckoutModal();
            window.open(whatsappUrl, '_blank');
        }

        // ADMIN PANEL LOGIC
        function openAdminAuth() { document.getElementById('admin-auth-modal').classList.remove('hidden'); }
        function closeAdminAuth() { document.getElementById('admin-auth-modal').classList.add('hidden'); }

        function verifyAdminPassword() {
            if (document.getElementById('admin-pass-input').value === (settings.adminPassword || "admin123")) {
                closeAdminAuth();
                openAdminDashboard();
            } else {
                alert('Incorrect Password!');
            }
        }

        function openAdminDashboard() {
            document.getElementById('admin-dashboard-modal').classList.remove('hidden');
            renderAdminProductsTable();
            renderAdminOrders();
            populateSettingsForm();
        }

        function closeAdminDashboard() { document.getElementById('admin-dashboard-modal').classList.add('hidden'); }

        function switchAdminTab(tab) {
            ['products', 'orders', 'settings'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).className = "px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-gray-600 hover:text-indigo-600 whitespace-nowrap";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).className = "px-6 py-3 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 bg-white whitespace-nowrap";
        }

        function renderAdminOrders() {
            const container = document.getElementById('admin-orders-list');
            if (liveOrders.length === 0) return container.innerHTML = `<p class="text-gray-500 text-sm">No live orders found.</p>`;

            container.innerHTML = liveOrders.map(o => `
                <div class="border rounded-xl p-4 bg-gray-50 space-y-2 shadow-sm">
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="font-bold text-gray-800 text-sm">Order ID: ${o.id.substring(1, 8)}</span>
                        <span class="text-xs text-gray-500">${o.date}</span>
                    </div>
                    <div class="text-xs space-y-1 text-gray-700">
                        <p><strong>Customer:</strong> ${o.name}</p>
                        <p><strong>Phone:</strong> ${o.phone}</p>
                        <p><strong>Address:</strong> ${o.address}</p>
                    </div>
                    <div class="text-xs bg-white p-2 border rounded space-y-1">
                        <p class="font-bold text-gray-700">Items:</p>
                        ${o.items.map(i => `<p>• ${i.title} (x${i.qty}) - Rs. ${(i.price * i.qty).toLocaleString()}</p>`).join('')}
                        <p class="font-bold text-indigo-600 pt-1">Total: Rs. ${o.total.toLocaleString()}</p>
                    </div>
                </div>
            `).join('');
        }

        function clearAllOrders() {
            if (confirm('Clear all orders from live database?')) {
                db.ref('orders').remove();
            }
        }

        function renderAdminProductsTable() {
            const table = document.getElementById('admin-products-table');
            table.innerHTML = products.map(p => `
                <tr>
                    <td class="p-2 border"><img src="${p.image}" class="w-10 h-10 object-cover rounded"></td>
                    <td class="p-2 border font-semibold">${p.title}</td>
                    <td class="p-2 border">Rs. ${p.price.toLocaleString()}</td>
                    <td class="p-2 border">${p.category}</td>
                    <td class="p-2 border"><button onclick="deleteProduct(${p.id})" class="text-red-600 font-bold hover:underline">Delete</button></td>
                </tr>
            `).join('');
        }

        function handleAddProduct(e) {
            e.preventDefault();
            products.push({
                id: Date.now(),
                title: document.getElementById('prod-title').value,
                price: parseFloat(document.getElementById('prod-price').value),
                category: document.getElementById('prod-category').value,
                image: document.getElementById('prod-image').value,
                description: document.getElementById('prod-desc').value
            });
            localStorage.setItem('products', JSON.stringify(products));
            document.getElementById('add-product-form').reset();
            renderAdminProductsTable(); renderProducts();
            alert('Product Added!');
        }

        function deleteProduct(id) {
            if (confirm('Delete product?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('products', JSON.stringify(products));
                renderAdminProductsTable(); renderProducts();
            }
        }

        function populateSettingsForm() {
            document.getElementById('set-store-name').value = settings.storeName;
            document.getElementById('set-whatsapp').value = settings.whatsapp;
            document.getElementById('set-admin-pass').value = settings.adminPassword || "admin123";
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            settings.storeName = document.getElementById('set-store-name').value;
            settings.whatsapp = document.getElementById('set-whatsapp').value;
            settings.adminPassword = document.getElementById('set-admin-pass').value || "admin123";

            localStorage.setItem('store_settings', JSON.stringify(settings));
            applySettings();
            alert('Settings Saved Successfully!');
            closeAdminDashboard();
        }
    </script>
</body>
