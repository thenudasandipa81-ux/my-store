<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laba Kade - Dashboard</title>
  <style>
    :root {
      --primary-black: #111111;
      --primary-gold: #c59b27;
      --bg-light: #f4f6f8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); color: #333; }

    header {
      background-color: #fff;
      border-bottom: 2px solid var(--primary-gold);
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .logo-container { display: flex; align-items: center; gap: 10px; }
    .logo-container img { height: 50px; width: auto; object-fit: contain; }
    .logo-container h1 { font-size: 1.5rem; color: var(--primary-black); }

    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    h2 { font-size: 1.2rem; color: var(--primary-black); border-bottom: 2px solid var(--primary-gold); padding-bottom: 5px; margin-bottom: 15px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
    }

    button {
      background: var(--primary-black);
      color: var(--primary-gold);
      border: 1px solid var(--primary-gold);
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      transition: 0.2s ease;
    }
    button:hover { background: var(--primary-gold); color: #fff; }

    /* Responsive Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    /* Product List Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f0f0f0; }
    .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <!-- Upload karapu Logo Image eka base64/URL ekak widiyata set karagන්න -->
      <img src="YOUR_LOGO_URL_HERE.jpg" alt="Laba Kade Logo" id="brandLogo">
      <h1>Laba Kade</h1>
    </div>
  </header>

  <div class="container">

    <!-- 1. Add Product Section -->
    <div class="card">
      <h2>Add Product</h2>
      <form id="productForm">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="pName" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Price (LKR)</label>
            <input type="number" id="pPrice" required>
          </div>
          <div class="form-group">
            <label>Optimized Fast Image Upload</label>
            <input type="file" id="pImage" accept="image/*" required>
          </div>
        </div>
        <button type="submit">Save Product</button>
      </form>
    </div>

    <!-- 2. Product Summary -->
    <div class="card">
      <h2>Product Summary</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Img</th>
              <th>Name</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody id="productTable">
            <!-- Dynamic Data -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 3. Checkout Section -->
    <div class="card">
      <h2>Quick Checkout</h2>
      <div class="form-group">
        <label>Customer Name</label>
        <input type="text" placeholder="Enter name">
      </div>
      <button onclick="alert('Order Sent Successfully!')">Complete Checkout</button>
    </div>

    <!-- 4. Settings: Bank Details, WhatsApp, Password -->
    <div class="card grid-2">
      <div>
        <h2>Bank Details</h2>
        <div class="form-group">
          <label>Bank Name & Account No.</label>
          <textarea rows="3" placeholder="Commercial Bank - 1234567890"></textarea>
        </div>
        <button onclick="alert('Bank Details Saved')">Save Bank Info</button>
      </div>

      <div>
        <h2>Account Settings</h2>
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="text" id="waNumber" value="+947XXXXXXXX">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" placeholder="••••••••">
        </div>
        <button onclick="alert('Account Updated')">Update Settings</button>
      </div>
    </div>

  </div>

  <script>
    const products = [];

    // Image Upload Optimize (Client side resize before upload)
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('pName').value;
      const price = document.getElementById('pPrice').value;
      const fileInput = document.getElementById('pImage');

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
          const img = new Image();
          img.src = e.target.result;
          
          img.onload = function() {
            // Compress Image on browser canvas
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400; // Resize to fast small resolution
            const scaleFactor = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleFactor;

            const ctx = canvas.getContext('canvas');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Fast base64 Image String
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

            // Save to Array
            products.push({ name, price, img: compressedBase64 });
            renderSummary();
            document.getElementById('productForm').reset();
          }
        }
        reader.readAsDataURL(file);
      }
    });

    function renderSummary() {
      const tbody = document.getElementById('productTable');
      tbody.innerHTML = '';
      products.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td><img src="${p.img}" class="thumb"></td>
            <td>${p.name}</td>
            <td>Rs. ${p.price}</td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
